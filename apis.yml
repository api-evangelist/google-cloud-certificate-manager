aid: google-cloud-certificate-manager
name: Google Cloud Certificate Manager
description: >-
  Google Cloud Certificate Manager is a service that lets you acquire and manage TLS (SSL) certificates for use with
  Google Cloud load balancers and other Google Cloud services. It supports provisioning, renewing, and deploying both
  Google-managed and self-managed certificates, simplifying certificate lifecycle management at scale.
